name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar motor VPN (hev-socks5-tunnel)
        run: |
          mkdir -p hev
          git clone --recursive --depth 1 --shallow-submodules https://github.com/heiher/hev-socks5-tunnel hev/jni
          cd hev
          "$ANDROID_NDK_HOME/ndk-build" -j4 APP_ABI="arm64-v8a armeabi-v7a x86_64" APP_PLATFORM=android-24
          mkdir -p ../app/src/main/jniLibs
          cp -r libs/* ../app/src/main/jniLibs/
          ls -R ../app/src/main/jniLibs
      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HTTP-Plus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HTTP-Plus-apk
          path: HTTP-Plus.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HTTP Plus build ${{ github.run_number }}
          files: HTTP-Plus.apk
          make_latest: true
