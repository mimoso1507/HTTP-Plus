name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HTTP-Plus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HTTP-Plus-apk
          path: HTTP-Plus.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HTTP Plus build ${{ github.run_number }}
          files: HTTP-Plus.apk
          make_latest: true
